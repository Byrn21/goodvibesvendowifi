services:
  - type: web
    name: goodvibesvendowifi
    plan: free
    region: oregon
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: false
      - key: DEFAULT_SESSION_DURATION
        value: 60
      - key: SESSION_DURATION_OPTIONS
        value: 60,120,180,360,720,1440
      - key: PAUSE_ENABLED
        value: true
      - key: SESSION_ENFORCE_INTERVAL
        value: 60000
      - key: CORS_ORIGINS
        value: https://goodvibesvendowifi.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 600
      - key: LOGIN_RATE_LIMIT_MAX
        value: 25
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_REDIRECT_URL
        value: https://www.google.com
      # Secrets � set these in the Render dashboard
      # ADMIN_API_KEY
      # ADMIN_USERNAME
      # ADMIN_PASSWORD
      # PRICE_PER_HOUR
      # PREMIUM_PRICE_MODIFIER
      # PREMIUM_PAUSE_VALIDITY_HOURS
      # BASE_URL (your Render service URL)
      # FRONTEND_ORIGIN (your frontend URL)
      # OMADA_BASE_URL
      # OMADA_API_TOKEN
      # OMADA_SITE
      # JWT_SECRET
      # OMADA_MOCK
      # OMADA_TLS_REJECT
      # ALLOWED_REDIRECT_DOMAINS

databases:
  - name: postgres
    plan: free
    region: oregon
