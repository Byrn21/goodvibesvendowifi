<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoodVibesVendoWifi Admin Panel</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/png" href="assets/images/goodvibes.png">
  <style>
    /* Body background comes from assets/style.css (var(--accent) + grid).
       Only the centering layout is declared here. */
    body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; margin: 0; padding: 16px; }
    .login-container { max-width: 400px; width: 100%; }
    .login-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-card); }
    .login-card h1 { margin: 0 0 8px 0; color: var(--text); font-size: 24px; }
    .login-card p.muted { color: var(--text-3); font-size: 14px; margin: 0 0 24px 0; }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    .form-row input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-size: 14px; background: var(--surface); color: var(--text); }
    .btn--primary { width: 100%; padding: 12px 16px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn--primary:hover { background: var(--green-hover); }
    .error-msg { color: var(--error-text); font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="assets/images/goodvibes.png" alt="Good Vibes Logo" style="max-width: 120px; display: block; margin: 0 auto 15px;">
      <h1>GoodVibesVendoWifi Admin Panel</h1>
      <p class="muted">Enter your credentials to access the admin panel.</p>
      <div id="login-form">
        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username">
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <button id="login-btn" class="btn--primary">Log In</button>
        <div id="login-error" class="error-msg"></div>
      </div>
    </div>
  </div>
  <script src="config/config.js"></script>
  <script>
    (function () {
      'use strict';

      var API_BASE = (window.CONFIG && window.CONFIG.apiBaseUrl) || '';

      var btn = document.getElementById('login-btn');
      var errorDiv = document.getElementById('login-error');

      var MAX_AUTO_RETRIES = 3;
      var autoRetryCount = 0;
      var retryTimer = null;

      function setDisabled(disabled) {
        btn.disabled = disabled;
        btn.textContent = disabled ? 'Please wait…' : 'Log In';
      }

      // Live countdown, then retry the login automatically
      function scheduleRetry(seconds, username, password) {
        if (retryTimer) clearInterval(retryTimer);
        var remaining = Math.min(seconds, 900); // cap display at 15 min
        setDisabled(true);
        retryTimer = setInterval(function () {
          errorDiv.textContent = 'Too many login attempts. Retrying in ' + remaining + ' second' + (remaining === 1 ? '' : 's') + '…';
          remaining--;
          if (remaining < 0) {
            clearInterval(retryTimer);
            retryTimer = null;
            attemptLogin(username, password);
          }
        }, 1000);
      }

      function attemptLogin(username, password) {
        errorDiv.textContent = '';
        setDisabled(true);

        fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        }).then(function (r) {
          return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; });
        }).then(function (res) {
          if (res.ok && res.data.success) {
            if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
            localStorage.setItem('adminToken', res.data.token);
            window.location.href = 'admin.html';
            return;
          }
          if (res.status === 429 || res.data.code === 'RATE_LIMITED') {
            var waitSecs = parseInt(res.data.retryAfterSeconds, 10);
            // Fallback: backend always sends retryAfterSeconds, but if it is
            // missing (e.g. an older server), default to 60 seconds.
            if (isNaN(waitSecs) || waitSecs <= 0) waitSecs = 60;
            errorDiv.textContent = res.data.error || 'Too many login attempts. Please try again later.';
            if (autoRetryCount < MAX_AUTO_RETRIES) {
              autoRetryCount++;
              scheduleRetry(waitSecs, username, password);
            }
            return;
          }
          setDisabled(false);
          errorDiv.textContent = res.data.error || 'Login failed. Check your credentials.';
        }).catch(function (err) {
          setDisabled(false);
          errorDiv.textContent = 'Connection error: ' + err.message;
        });
      }

      btn.addEventListener('click', function () {
        if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;

        if (!username || !password) {
          errorDiv.textContent = 'Please enter both username and password.';
          return;
        }

        autoRetryCount = 0;
        attemptLogin(username, password);
      });
    })();
  </script>
</body>
</html>
